# Security Reference Staleness Check
#
# reference/security/manifest.json records the version of every security
# corpus crefft's guidance is built on. This job compares the recorded
# version against upstream for each source that has a machine-checkable
# release channel and reports drift in the job log.
#
# Sources checked here:
#   MITRE ATT&CK   github.com/mitre/cti releases
#   MITRE ATLAS    github.com/mitre-atlas/atlas-data releases
#   MITRE D3FEND   github.com/d3fend/d3fend-ontology tags
#   CWE            cwe-api.mitre.org content version
#   SLSA           github.com/slsa-framework/slsa *tags* — the project
#                  publishes no GitHub Releases, so the previous
#                  releases/latest call 404'd and reported a null version
#   OpenSSF        github.com/ossf/scorecard releases
#   Sigma          github.com/SigmaHQ/sigma releases
#
# CWE Top 25 rankings and the OWASP Top 10 families have no stable machine
# endpoint and remain manual review items.
#
# Any transport, HTTP, or parse failure fails the job. A missing or null
# version is never reported as drift.

name: Check Security References

on:
  schedule:
    # Monthly on the 1st at 03:17 UTC. An off-peak minute reduces the chance
    # of a scheduling backlog silently dropping the run.
    - cron: '17 3 1 * *'
  # Unauthenticated GitHub API calls from the forge are rate-limited, so
  # development events run only when the references or this check change.
  pull_request:
    paths: ['reference/security/**', '.forgejo/workflows/check-security-refs.yml']
  push:
    branches: ['**']
    paths: ['reference/security/**', '.forgejo/workflows/check-security-refs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-references-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-versions:
    name: Compare manifest against upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'

      - name: Compare versions and report
        run: |
          node <<'JS'
          async function main() {
            const fs = require('fs');

            const manifest = JSON.parse(
              fs.readFileSync('reference/security/manifest.json', 'utf8')
            );

            const recorded = (key, path = ['version']) => {
              let node = manifest.sources?.[key];
              for (const step of path) {
                if (node === undefined || node === null) return null;
                node = node[step];
              }
              return node ?? null;
            };

            // --- upstream adapters -------------------------------------------------

            const strip = (tag) => String(tag).replace(/^(ATT&CK-)?v/i, '');

            const githubJSON = async (path) => {
              const response = await fetch(`https://api.github.com${path}`, {
                headers: { Accept: 'application/vnd.github+json' },
              });
              if (!response.ok) {
                throw new Error(`GitHub ${path} returned HTTP ${response.status}`);
              }
              return response.json();
            };

            // Every adapter throws on transport, HTTP, or parse failure. A null
            // or empty result is a failure, never "up to date."
            const latestRelease = async (owner, repo) => {
              const data = await githubJSON(`/repos/${owner}/${repo}/releases/latest`);
              if (!data?.tag_name) {
                throw new Error(`${owner}/${repo}: release carried no tag_name`);
              }
              return strip(data.tag_name);
            };

            // Semver-ordered newest stable tag. Date-style and pre-release tags
            // are excluded so v2021-04-21 and v1.2-rc1 cannot win.
            const latestSemverTag = async (owner, repo) => {
              const tags = [];
              for (let page = 1; ; page += 1) {
                const batch = await githubJSON(`/repos/${owner}/${repo}/tags?per_page=100&page=${page}`);
                if (!Array.isArray(batch)) {
                  throw new Error(`${owner}/${repo}: tags response was not an array`);
                }
                tags.push(...batch);
                if (batch.length < 100) break;
              }
              const parsed = tags
                .map((tag) => /^v?(\d+)\.(\d+)(?:\.(\d+))?$/.exec(tag.name))
                .filter(Boolean)
                .map((m) => ({
                  raw: m[0],
                  parts: [Number(m[1]), Number(m[2]), Number(m[3] ?? 0)],
                }));
              if (parsed.length === 0) {
                throw new Error(`${owner}/${repo}: no semver tags found`);
              }
              parsed.sort((a, b) => {
                for (let i = 0; i < 3; i += 1) {
                  if (a.parts[i] !== b.parts[i]) return a.parts[i] - b.parts[i];
                }
                return 0;
              });
              return strip(parsed[parsed.length - 1].raw);
            };

            const cweContentVersion = async () => {
              const response = await fetch('https://cwe-api.mitre.org/api/v1/cwe/version', {
                headers: { Accept: 'application/json' },
              });
              if (!response.ok) {
                throw new Error(`CWE API returned HTTP ${response.status}`);
              }
              const body = await response.json();
              if (!body?.ContentVersion) {
                throw new Error('CWE API response carried no ContentVersion');
              }
              return String(body.ContentVersion);
            };

            const CHECKS = [
              {
                key: 'mitre_attack',
                label: 'MITRE ATT&CK',
                source: 'github.com/mitre/cti releases',
                current: () => recorded('mitre_attack'),
                latest: () => latestRelease('mitre', 'cti'),
              },
              {
                key: 'mitre_atlas',
                label: 'MITRE ATLAS',
                source: 'github.com/mitre-atlas/atlas-data releases',
                current: () => recorded('mitre_atlas'),
                latest: () => latestRelease('mitre-atlas', 'atlas-data'),
              },
              {
                key: 'mitre_d3fend',
                label: 'MITRE D3FEND',
                source: 'github.com/d3fend/d3fend-ontology tags',
                current: () => recorded('mitre_d3fend'),
                latest: () => latestSemverTag('d3fend', 'd3fend-ontology'),
              },
              {
                key: 'cwe',
                label: 'CWE',
                source: 'cwe-api.mitre.org content version',
                current: () => recorded('cwe'),
                latest: cweContentVersion,
              },
              {
                key: 'slsa',
                label: 'SLSA',
                source: 'github.com/slsa-framework/slsa tags (no releases published)',
                current: () => recorded('slsa'),
                latest: () => latestSemverTag('slsa-framework', 'slsa'),
              },
              {
                key: 'openssf_scorecard',
                label: 'OpenSSF Scorecard',
                source: 'github.com/ossf/scorecard releases',
                current: () => recorded('openssf_scorecard'),
                latest: () => latestRelease('ossf', 'scorecard'),
              },
              {
                key: 'sigma_rules',
                label: 'Sigma rules',
                source: 'github.com/SigmaHQ/sigma releases',
                current: () => recorded('sigma_rules'),
                latest: async () => {
                  const data = await githubJSON('/repos/SigmaHQ/sigma/releases/latest');
                  if (!data?.tag_name) {
                    throw new Error('SigmaHQ/sigma: release carried no tag_name');
                  }
                  // Sigma tags are dated (r2026-07-01), not semantic.
                  return String(data.tag_name);
                },
              },
            ];

            // --- run ---------------------------------------------------------------

            const rows = [];
            const drift = [];
            const errors = [];

            for (const check of CHECKS) {
              const current = check.current();
              if (current === null || current === undefined || current === '') {
                errors.push(`${check.label}: manifest has no recorded version for '${check.key}'`);
                rows.push([check.label, '—', '—', 'manifest error']);
                continue;
              }

              let latest;
              try {
                latest = await check.latest();
              } catch (error) {
                errors.push(`${check.label}: ${error.message}`);
                rows.push([check.label, String(current), '—', 'check failed']);
                continue;
              }

              if (!latest) {
                errors.push(`${check.label}: upstream returned an empty version`);
                rows.push([check.label, String(current), '—', 'check failed']);
                continue;
              }

              const stale = String(current) !== String(latest);
              if (stale) {
                drift.push({ ...check, current: String(current), latest: String(latest) });
              }
              rows.push([check.label, String(current), String(latest), stale ? 'outdated' : 'current']);
            }

            // --- report ------------------------------------------------------------

            console.log('Security reference staleness');
            console.table(rows.map(([source, manifest, upstream, status]) =>
              ({ source, manifest, upstream, status })));
            console.log('Manual review: CWE Top 25 and the OWASP Top 10 families.');

            if (errors.length > 0) {
              throw new Error(
                `${errors.length} security-reference check(s) could not complete: ${errors.join('; ')}`
              );
            } else if (drift.length > 0) {
              console.warn(`${drift.length} security reference(s) are outdated.`);
            }
          }
          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          JS
