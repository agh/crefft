name: Renovate Synchronization

on:
  push:
    branches: ['renovate/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: renovate-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Check the update after synchronizing pins
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
          activate-environment: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Synchronize tool pins
        run: python3 scripts/sync_tool_versions.py

      - name: Show synchronization diff
        run: |
          git status --short
          git diff --stat

      - name: Check the synchronized update
        run: make check
