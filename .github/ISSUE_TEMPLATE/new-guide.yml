name: New guide proposal
description: Propose a language, framework, process, or topic that crefft should cover.
title: "feat(<scope>): add <topic> guide"
labels: ["new-guide"]
body:
  - type: markdown
    attributes:
      value: |
        A new guide is a real commitment: it has to be maintained, its tool
        versions kept current, and its claims kept true. Make the case.
        The maintainer writes and maintains accepted guides. Propose the
        coverage here, not in a pull request, so scope is agreed first.

  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: Elixir
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Language
        - Framework
        - API design
        - Process
        - Design
        - Infrastructure
        - Documentation
        - AI-assisted development
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why crefft should cover this
      description: >
        What decisions would this guide settle that are currently unsettled?
        Who is asking?
    validations:
      required: true

  - type: textarea
    id: tooling
    attributes:
      label: Proposed toolchain
      description: >
        Lint, format, type check, test, coverage, fuzz, package management, and
        vulnerability scanning. Name the tool, the version, and why it beats
        the alternatives. Every version **MUST** be pinned and sourced.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: Upstream style guides to reference
      description: >
        Existing authoritative guides for this topic, with URLs and their
        licenses. Anything vendored into `reference/` **MUST** have its license
        recorded in `THIRD_PARTY_NOTICES.md`.

  - type: textarea
    id: overlap
    attributes:
      label: Overlap with existing guides
      description: >
        Which existing crefft guides does this touch? crefft links rather
        than duplicates.

  - type: checkboxes
    id: houserules
    attributes:
      label: Before submitting
      options:
        - label: I read CONTRIBUTING.md and the house rules for guide structure.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
