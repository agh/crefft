name: Close external pull requests

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

# Closing and commenting need only this permission; all others are disabled.
permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target uses the trusted base-branch workflow and token.
      # Never check out code, run a PR script, or download an artifact here.
      # No actions are needed: gh is preinstalled on the hosted runner.
      - name: Close external pull requests with a pointer to issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOSURE_COMMENT: >-
            Thank you for the proposal. crefft accepts issues rather than external
            pull requests so the maintainer can verify the evidence and scope before
            making changes. Please use an issue form:
            https://github.com/agh/crefft/issues/new/choose
        # Event data stays in quoted environment variables, never shell source.
        # Check the PR author, not the actor who reopened or marked it ready.
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" = "$REPOSITORY_OWNER" ] || [ "$PR_AUTHOR" = 'dependabot[bot]' ]; then
            exit 0
          fi
          gh pr close "$PR_NUMBER" --repo "$GH_REPO" --comment \
            "$CLOSURE_COMMENT"
